name: aegisgraph

x-api-environment: &api-environment
  APP_ENV: development
  LOG_LEVEL: INFO
  ENFORCE_SECURE_CONFIGURATION: "false"
  ALLOW_REAL_CUSTOMER_DATA: "false"
  DATABASE_URL: postgresql+asyncpg://aegisgraph:aegisgraph_dev@postgres:5432/aegisgraph
  REDIS_URL: redis://redis:6379/0
  KAFKA_BOOTSTRAP_SERVERS: '["kafka:9092"]'
  KAFKA_SECURITY_PROTOCOL: PLAINTEXT
  NEO4J_URI: neo4j://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-aegisgraph_neo4j_dev}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-dev-jwt-key-change-before-any-shared-deployment-64-characters}
  IDENTITY_HMAC_KEY: ${IDENTITY_HMAC_KEY:-local-dev-hmac-key-change-before-any-shared-deployment-64-characters}
  IDENTITY_ENCRYPTION_KEY: ${IDENTITY_ENCRYPTION_KEY:-MDAxMjM0NTY3ODlhYmNkZWYwMTIzNDU2Nzg5YWJjZGVmMDE=}
  TRUSTED_HOSTS: '["localhost","127.0.0.1","api"]'
  CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aegisgraph
      POSTGRES_USER: aegisgraph
      POSTGRES_PASSWORD: aegisgraph_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegisgraph -d aegisgraph"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payments.transactions.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payments.transactions.dlq.v1 --partitions 1 --replication-factor 1
    restart: "no"

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-aegisgraph_neo4j_dev}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    volumes:
      - neo4j_data:/data
    ports:
      - "7474:7474"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  neo4j-init:
    image: neo4j:5.26-community
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-aegisgraph_neo4j_dev}
    volumes:
      - ./graph/schema.cypher:/schema.cypher:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - cypher-shell -a neo4j://neo4j:7687 -u neo4j -p "$${NEO4J_PASSWORD}" -f /schema.cypher
    restart: "no"

  migrate:
    build:
      context: .
      target: runtime
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      neo4j-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "9090:9090"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  neo4j_data:
  prometheus_data:
